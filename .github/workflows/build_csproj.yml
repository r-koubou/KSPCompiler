name: Build csproj project

on:
  workflow_call:
    inputs:
      prefix:
        required: true
        type: string
        description: |
          The prefix string to use for the artifact name.
      base_dir:
        required: true
        type: string
        description: |
          The base directory path of the .csproj file to build. (relative to repository root)
      csproject_filename:
        required: true
        type: string
        description: |
          The path to the .csproj file name to build.
      version:
        required: false
        type: string
        default: ""
        description: |
          Application version to set (e.g.: 1.2.3).
      channel:
        required: true
        type: string
        default: "develop"
        description: |
          Build channel (develop, rc, release)

  workflow_dispatch:
    inputs:
      prefix:
        required: true
        type: string
        description: |
          The prefix string to use for the artifact name.
      base_dir:
        required: true
        type: string
        description: |
          The base directory path of the .csproj file to build. (relative to repository root)
      csproject_filename:
        required: true
        type: string
        description: |
          The path to the .csproj file name to build.
      version:
        required: false
        type: string
        default: ""
        description: |
          Application version to set (e.g.: 1.2.3).
      channel:
        required: true
        type: choice
        options:
          - develop
          - rc
          - release
        description: |
          Build channel (develop, rc, release)

#--------------------------------------------------------------
# Build C# project
#--------------------------------------------------------------
jobs:
  build-csproj:
    name: build (${{ matrix.build_configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Debug, Release]
    env:
      DOTNET_SDK_VERSION: '10.*'
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      PREFIX: ${{ inputs.prefix }}
      CSPROJ_FILENAME: ${{ inputs.csproject_filename }}
      BASE_DIR: ${{ github.workspace }}/${{ inputs.base_dir }}
      PUBLISH_DIRNAME: publish
      BUILD_CONFIGURATION: ${{ matrix.build_configuration }}

    steps:
    - name: Show workflow inputs
      run: |
        {
          echo "## Workflow Inputs"
          echo ""
          echo "|name|value|"
          echo "|----|-----|"
          echo "|ref| ${{ github.ref }}|"
          echo "|Commit SHA| ${{ github.sha }}|"
          echo "|Version|${{ inputs.version }}|"
          echo "|Channel|${{ inputs.channel }}|"
          echo "|Prefix|${{ inputs.prefix }}|"
          echo "|Base Directory|${{ inputs.base_dir }}|"
          echo "|csproj Filename|${{ inputs.csproject_filename }}|"
          echo ""
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Guard - tag build must be release channel
    #----------------------------------------------------------
    - name: Guard - tag build must be release channel
      if: ${{ inputs.channel == 'release' && !startsWith(github.ref, 'refs/tags/v') }}
      run: |
        echo "::error::Must use channel=release when building from tag/v*"
        exit 1

    #----------------------------------------------------------
    # Setup Environment Variables
    #----------------------------------------------------------
    - name: Sanitize Branch Name
      run: echo "BRANCH_NAME=$(echo ${{ github.ref_name }} | sed 's|/|-|g')" >> $GITHUB_ENV

    - name:  Setup csproj file path variable
      run: |
        echo "CSPROJ_PATH=${{ env.BASE_DIR }}/${{ env.CSPROJ_FILENAME }}" >> $GITHUB_ENV

    - name: Setup Publish Directory Variable
      run: |
        echo "PUBLISH_DIR=${{ env.BASE_DIR }}/${{ env.PUBLISH_DIRNAME }}" >> $GITHUB_ENV
        echo "PUBLISH_RELATIVE_DIR_FROM_BASE=${{ env.PUBLISH_DIRNAME }}" >> $GITHUB_ENV

    - name: Setup Version Information Path Variable
      env:
        PUBLISH_DIR: ${{ env.PUBLISH_DIR }}
      run: |
        echo "VERSION_INFO_PATH=${{ env.PUBLISH_DIR }}/VERSION.txt" >> $GITHUB_ENV

    #----------------------------------------------------------
    # Checkout repository
    #----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    #----------------------------------------------------------
    # Setup the application version
    #----------------------------------------------------------
    - name: "Setup the application version ('AssemblyVersion' tag in csproj)"
      if: ${{ inputs.version == '' }}
      env:
        CSPROJ_PATH: ${{ env.CSPROJ_PATH }}
      run: |
          VERSION=$(grep '<AssemblyVersion>' ${{ env.CSPROJ_PATH }} | sed -E 's/.*<AssemblyVersion>([^<]+)<\/AssemblyVersion>.*/\1/')
          if [ "$VERSION" == "" ]; then
            VERSION="0.0.0"
            echo "::warning::Could not find AssemblyVersion tag in csproj file. Defaulting to ${VERSION}"
          fi
          echo "BUILD_VERSION=${VERSION}" >> $GITHUB_ENV

    - name: "Setup the application version (inputs.version)"
      if: ${{ inputs.version != '' }}
      run: |
        echo "::info::The version value will be overridden to '${{ inputs.version }}'"
        echo "BUILD_VERSION=${{ inputs.version }}" >> $GITHUB_ENV

    #----------------------------------------------------------
    # Setup the artifact name
    #----------------------------------------------------------
    - name: Setup the artifact name
      env:
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
      run: |
        echo "ARTIFACT_NAME=${{ env.PREFIX }}-${{ env.BUILD_CONFIGURATION }}-v${{ env.BUILD_VERSION }}-${{ inputs.channel }}" >> $GITHUB_ENV

    - name: Show the artifact name
      env:
        ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      run: |
        {
          echo "## Artifact Name"
          echo ""
          echo "${{ env.ARTIFACT_NAME }}"
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Show setup Environment Variables
    #----------------------------------------------------------
    - name: Show Environment Variables
      env:
        PREFIX: ${{ env.PREFIX }}
        DOTNET_SDK_VERSION: ${{ env.DOTNET_SDK_VERSION }}
        BASE_DIR: ${{ env.BASE_DIR }}
        CSPROJ_PATH: ${{ env.CSPROJ_PATH }}
        PUBLISH_DIR: ${{ env.PUBLISH_DIR }}
        BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
        VERSION_INFO_PATH: ${{ env.VERSION_INFO_PATH }}
        ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
      run: |
        {
          echo "## Environment Variables"
          echo ""
          echo "<details>"
          echo "<summary>Click to expand</summary>"
          echo ""
          echo "|name|value|"
          echo "|----|-----|"
          echo "|PREFIX|${{ env.PREFIX }}|"
          echo "|DOTNET_SDK_VERSION|${{ env.DOTNET_SDK_VERSION }}|"
          echo "|BASE_DIR|${{ env.BASE_DIR }}|"
          echo "|CSPROJ_PATH|${{ env.CSPROJ_PATH }}|"
          echo "|PUBLISH_DIR|${{ env.PUBLISH_DIR }}|"
          echo "|BUILD_CONFIGURATION|${{ env.BUILD_CONFIGURATION }}|"
          echo "|BUILD_VERSION|${{ env.BUILD_VERSION }}|"
          echo "|VERSION_INFO_PATH|${{ env.VERSION_INFO_PATH }}|"
          echo "|ARTIFACT_NAME|${{ env.ARTIFACT_NAME }}|"
          echo ""
          echo "</details>"
        } >> $GITHUB_STEP_SUMMARY


    #----------------------------------------------------------
    # Setup .NET SDK
    #----------------------------------------------------------
    - name: Install .NET SDK
      uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

    #----------------------------------------------------------
    # Show .csproj file
    #----------------------------------------------------------
    - name: Show .csproj file
      env:
        CSPROJ_PATH: ${{ env.CSPROJ_PATH }}
      run: |
        {
          echo "## .csproj file content"
          echo ""
          echo "<details>"
          echo "<summary>Click to expand</summary>"
          echo ""
          echo "\`\`\`xml"
          cat ${{ env.CSPROJ_PATH }}
          echo "\`\`\`"
          echo ""
          echo "</details>"
          echo ""
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Build
    #----------------------------------------------------------
    - name: Build Project
      env:
        BASE_DIR: ${{ env.BASE_DIR }}
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
        BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}
        PUBLISH_RELATIVE_DIR_FROM_BASE: ${{ env.PUBLISH_RELATIVE_DIR_FROM_BASE }}
      run: |
        pushd ${{ env.BASE_DIR }}
        dotnet publish -p:FileVersion=${{ env.BUILD_VERSION }} -p:Version=${{ env.BUILD_VERSION }} -p:AssemblyVersion=${{ env.BUILD_VERSION }} -c ${{ env.BUILD_CONFIGURATION }} -o ${{ env.PUBLISH_RELATIVE_DIR_FROM_BASE }}
        popd

    #----------------------------------------------------------
    # Create Version Information File
    #----------------------------------------------------------
    - name: Create Version information file
      env:
        PUBLISH_DIR: ${{ env.PUBLISH_DIR }}
        VERSION_INFO_PATH: ${{ env.VERSION_INFO_PATH }}
        BUILD_VERSION: ${{ env.BUILD_VERSION }}
        BUILD_CONFIGURATION: ${{ env.BUILD_CONFIGURATION }}
      run: |
        mkdir -p ${{ env.PUBLISH_DIR }}
        {
          echo "Build channel: ${{ inputs.channel }}"
          echo "Build date: $(date)"
          echo "Version: ${{ env.BUILD_VERSION }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Build Configuration: ${{ env.BUILD_CONFIGURATION }}"
        } >> ${{ env.VERSION_INFO_PATH }}

    - name: Show Version information file
      env:
        VERSION_INFO_PATH: ${{ env.VERSION_INFO_PATH }}
      run: |
        {
          if [ -f ${{ env.VERSION_INFO_PATH }} ]; then
            echo "## Version Information File"
            echo ""
            echo "\`\`\`"
            cat ${{ env.VERSION_INFO_PATH }}
            echo ""
            echo "\`\`\`"
          fi
        } >> $GITHUB_STEP_SUMMARY

    #----------------------------------------------------------
    # Create Artifact
    #----------------------------------------------------------
    - name: Create Artifact
      env:
        ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
        BASE_DIR: ${{ env.BASE_DIR }}
        PUBLISH_DIRNAME: ${{ env.PUBLISH_DIRNAME }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.BASE_DIR }}/${{ env.PUBLISH_DIRNAME }}
