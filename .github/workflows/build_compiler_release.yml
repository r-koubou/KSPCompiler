name: Build KSP Compiler (release)

on:
  push:
    branches:
      - release/*

  workflow_dispatch:
    inputs:
      version:
        required: false
        default: ''

jobs:
  build-compiler-release:
    uses: ./.github/workflows/build_csproj.yml
    secrets: inherit
    with:
      channel: release
      prefix: KSP-Compiler
      base_dir: "Compiler/Features/Compilation/Applications/Compilation.Cli"
      csproject_filename: "Compilation.Cli.csproj"
